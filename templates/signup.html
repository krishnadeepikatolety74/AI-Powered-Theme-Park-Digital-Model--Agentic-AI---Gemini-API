<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ParkOps Theme Park Digital Model</title>
  <meta name="description" content="Create your ParkOps account to start exploring and simulating theme park digital models.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="split-auth-layout">
    
    <!-- LEFT COLUMN: CRISP THEME PARK ARTWORK -->
    <div class="split-auth-hero signup-art"></div>

    <!-- RIGHT COLUMN: PURE CRISP WHITE SIGN UP FORM -->
    <div class="split-auth-form-side">
      
      <div class="split-auth-inner" style="max-width: 480px;">
        
        <!-- Brand Logo Header -->
        <div class="split-auth-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3"></circle>
              <line x1="12" y1="2" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              <line x1="19.07" y1="4.93" x2="4.93" y2="19.07"></line>
            </svg>
          </div>
          <div class="brand-title" style="font-size: 1.6rem;">Park<span>Ops</span></div>
          <div class="brand-tagline">A Smarter, Happier Theme Park</div>
        </div>

        <div class="split-auth-header">
          <h1 class="split-auth-title">Create Your Account</h1>
          <p class="split-auth-subtitle">Start your journey with ParkOps</p>
        </div>

        <!-- Flash / Error messages -->
        {% if error %}
          <div class="alert-box alert-danger" role="alert" id="signupErrorMsg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span>{{ error }}</span>
          </div>
        {% endif %}

        <form action="{{ url_for('signup') }}" method="POST" id="signupForm">
          
          <!-- ROW 1: FULL NAME & EMAIL -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem;">
            
            <div class="form-group">
              <div class="input-icon-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <input 
                  type="text" 
                  name="full_name" 
                  id="signupFullName" 
                  class="form-control" 
                  placeholder="Full Name" 
                  required 
                  autocomplete="name"
                >
              </div>
            </div>

            <div class="form-group">
              <div class="input-icon-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input 
                  type="email" 
                  name="email" 
                  id="signupEmail" 
                  class="form-control" 
                  placeholder="Email address" 
                  required 
                  autocomplete="email"
                >
              </div>
            </div>

          </div>

          <!-- ROW 2: PASSWORD & CONFIRM PASSWORD -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem;">
            
            <div class="form-group">
              <div class="input-icon-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input 
                  type="password" 
                  name="password" 
                  id="signupPassword" 
                  class="form-control" 
                  placeholder="Password" 
                  required 
                  autocomplete="new-password"
                >
                <button type="button" class="password-toggle-btn" data-target="signupPassword" aria-label="Toggle password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <div class="input-icon-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input 
                  type="password" 
                  name="confirm_password" 
                  id="signupConfirmPassword" 
                  class="form-control" 
                  placeholder="Confirm Password" 
                  required 
                  autocomplete="new-password"
                >
                <button type="button" class="password-toggle-btn" data-target="signupConfirmPassword" aria-label="Toggle confirm password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

          </div>

          <!-- ROW 3: PHONE NUMBER -->
          <div class="form-group">
            <div class="input-icon-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
              </span>
              <input 
                type="tel" 
                name="phone" 
                id="signupPhone" 
                class="form-control" 
                placeholder="Phone Number (Optional)"
              >
            </div>
          </div>

          <!-- ROW 4: SELECT COUNTRY -->
          <div class="form-group">
            <div class="input-icon-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="10" r="3"></circle>
                  <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"></path>
                </svg>
              </span>
              <select name="country" id="signupCountry" class="form-control" style="appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=\'%23566981\' height=\'24\' viewBox=\'0 0 24 24\' width=\'24\' xmlns=\'http://www.w3.org/2000/svg\'><path d=\'M7 10l5 5 5-5z\'/></svg>'); background-repeat: no-repeat; background-position: right 1rem center;">
                <option value="United States" selected>United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
                <option value="India">India</option>
                <option value="Germany">Germany</option>
                <option value="France">France</option>
                <option value="Japan">Japan</option>
                <option value="Singapore">Singapore</option>
                <option value="United Arab Emirates">United Arab Emirates</option>
              </select>
            </div>
          </div>

          <!-- TERMS CHECKBOX -->
          <div class="form-group" style="margin: 0.8rem 0 1.25rem;">
            <label class="remember-label" style="font-size: 0.84rem; align-items: flex-start;">
              <input type="checkbox" name="terms" required checked style="margin-top: 3px;">
              <span>I agree to the <a href="#" style="color: var(--primary-pink); font-weight: 700;">Terms of Service</a> and <a href="#" style="color: var(--primary-pink); font-weight: 700;">Privacy Policy</a></span>
            </label>
          </div>

          <!-- SUBMIT BUTTON -->
          <button type="submit" class="btn-auth-submit" id="submitSignUpBtn">
            Sign Up
          </button>

          <!-- OR DIVIDER -->
          <div class="divider-with-text">
            <span>OR CONTINUE WITH</span>
          </div>

          <!-- SOCIAL LOGIN BUTTONS -->
          <div class="social-login-grid">
            <button type="button" class="social-btn" aria-label="Sign up with Google" onclick="alert('Google SSO demo connected.')">
              <svg width="22" height="22" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.57.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
            </button>

            <button type="button" class="social-btn" aria-label="Sign up with Microsoft" onclick="alert('Microsoft SSO demo connected.')">
              <svg width="22" height="22" viewBox="0 0 23 23">
                <rect fill="#F25022" x="1" y="1" width="10" height="10"/>
                <rect fill="#7FBA00" x="12" y="1" width="10" height="10"/>
                <rect fill="#00A4EF" x="1" y="12" width="10" height="10"/>
                <rect fill="#FFB900" x="12" y="12" width="10" height="10"/>
              </svg>
            </button>

            <button type="button" class="social-btn" aria-label="Sign up with Apple" onclick="alert('Apple ID demo connected.')">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#000000">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.65-.82 1.09-1.95.97-3.1-.94.04-2.1.64-2.77 1.43-.59.68-1.11 1.77-.97 2.87 1.05.08 2.12-.55 2.77-1.2z"/>
              </svg>
            </button>
          </div>

          <!-- BOTTOM LINK -->
          <div class="auth-bottom-text">
            Already have an account? <a href="{{ url_for('signin') }}" id="goToSignInLink">Sign In</a>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
